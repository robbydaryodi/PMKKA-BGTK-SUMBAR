<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Fasilitator - Sekolah Model 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4f46e5', secondary: '#0f172a' }
                }
            }
        }
    </script>
    
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-lg tracking-tight text-primary">Portal Fasilitator</span>
                </div>
                <div id="navUser" class="hidden flex items-center gap-4">
                    <span id="navUserName" class="text-sm font-medium text-slate-600"></span>
                    <button onclick="logout()" class="text-sm font-medium text-red-500 hover:text-red-700 transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- VIEW LOGIN -->
    <div id="viewLogin" class="max-w-md mx-auto mt-20 px-4 fade-in">
        <div class="glass-card rounded-3xl p-8 shadow-xl border border-slate-100 text-center">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Selamat Datang</h2>
            <p class="text-slate-500 mb-8">Silakan masuk menggunakan akun Fasilitator Anda.</p>
            
            <div class="space-y-5">
                <div class="text-left">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Fasilitator</label>
                    <select id="loginFasilId" class="w-full border-slate-300 rounded-xl shadow-sm focus:ring-primary focus:border-primary px-4 py-3 border bg-slate-50">
                        <option value="">Memuat nama fasilitator...</option>
                    </select>
                </div>
                <div class="text-left">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" placeholder="6 Digit Terakhir No HP" class="w-full border-slate-300 rounded-xl shadow-sm focus:ring-primary focus:border-primary px-4 py-3 border bg-slate-50">
                </div>
                <button onclick="login()" class="w-full bg-primary hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-md mt-4">Masuk</button>
            </div>
        </div>
    </div>

    <!-- VIEW DASHBOARD -->
    <div id="viewDashboard" class="hidden max-w-5xl mx-auto px-4 py-12 fade-in">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900" id="dashGreeting">Halo, Fasilitator</h1>
            <p class="text-slate-500">Berikut adalah daftar sekolah binaan Anda. Silakan isi jadwal kunjungan untuk setiap sekolah.</p>
        </div>

        <div id="sekolahContainer" class="space-y-8">
            <!-- Rendered via JS -->
            <div class="text-center text-slate-500 py-12">Memuat data sekolah...</div>
        </div>
    </div>
    
    <!-- MODAL INPUT KUNJUNGAN -->
    <div id="modalKunjungan" class="hidden fixed inset-0 z-50 bg-slate-900/50 flex items-center justify-center p-4">
         <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden fade-in">
             <div class="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                 <div>
                    <h3 class="font-bold text-slate-800 text-lg" id="modalKunjunganTitle">Input Jadwal</h3>
                    <p class="text-sm text-slate-500" id="modalKunjunganSub"></p>
                 </div>
                 <button onclick="closeModalKunjungan()" class="text-slate-400 hover:text-slate-600 p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
             </div>
             <div class="p-6 space-y-4">
                 <input type="hidden" id="inputKunjunganNpsn">
                 <input type="hidden" id="inputKunjunganId">
                 
                 <div>
                     <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Kunjungan</label>
                     <input type="date" id="inputKunjunganTanggal" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary px-4 py-2 border">
                 </div>
                 <div>
                     <label class="block text-sm font-medium text-slate-700 mb-1">Status Kunjungan</label>
                     <select id="inputKunjunganStatus" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary px-4 py-2 border">
                         <option value="Direncanakan">Direncanakan</option>
                         <option value="Selesai">Selesai (Sudah Dikunjungi)</option>
                         <option value="Batal/Ditunda">Batal / Ditunda</option>
                     </select>
                 </div>
                 <div>
                     <label class="block text-sm font-medium text-slate-700 mb-1">Catatan (Opsional)</label>
                     <textarea id="inputKunjunganCatatan" rows="3" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary px-4 py-2 border" placeholder="Tuliskan hasil atau catatan kunjungan..."></textarea>
                 </div>
                 <div class="pt-4 border-t border-slate-100">
                     <button onclick="simpanKunjungan()" class="w-full bg-primary hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-sm">Simpan Jadwal</button>
                 </div>
             </div>
         </div>
    </div>

    <!-- Application Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCAMKzhVnGGUxdVKAWeoPXYTAZvPSq6yKY",
            authDomain: "sekolah-model-2026.firebaseapp.com",
            databaseURL: "https://sekolah-model-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sekolah-model-2026",
            storageBucket: "sekolah-model-2026.firebasestorage.app",
            messagingSenderId: "1014570073770",
            appId: "1:1014570073770:web:770e7e6cef2a52a3825ad3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let fasilData = {};
        let loggedInFasil = null;
        let allSchools = {};
        
        async function init() {
            try {
                const snapFasil = await db.ref('fasilitator').once('value');
                fasilData = snapFasil.val() || {};
                
                const select = document.getElementById('loginFasilId');
            let options = '<option value="">-- Pilih Nama Anda --</option>';
            for(let key in fasilData) {
                options += `<option value="${key}">${fasilData[key].nama}</option>`;
            }
            select.innerHTML = options;

            const storedFasilId = localStorage.getItem('loggedFasilId');
            if(storedFasilId && fasilData[storedFasilId]) {
                loggedInFasil = fasilData[storedFasilId];
                showDashboard();
            }
            } catch(e) {
                console.error(e);
                alert("Gagal memuat data fasilitator: " + e.message);
                document.getElementById('loginFasilId').innerHTML = '<option value="">Gagal Memuat Data</option>';
            }
        }
        init();

        function login() {
            const fasilId = document.getElementById('loginFasilId').value;
            const password = document.getElementById('loginPassword').value;
            
            if(!fasilId) return alert("Pilih nama Anda");
            if(!password) return alert("Masukkan password");

            const fasil = fasilData[fasilId];
            const correctPassword = fasil.hp.slice(-6);
            
            if(password !== correctPassword) {
                return alert("Password salah! (Gunakan 6 digit terakhir nomor HP Anda)");
            }

            loggedInFasil = fasil;
            localStorage.setItem('loggedFasilId', fasil.id);
            showDashboard();
        }

        function logout() {
            loggedInFasil = null;
            localStorage.removeItem('loggedFasilId');
            document.getElementById('viewLogin').classList.remove('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');
            document.getElementById('navUser').classList.add('hidden');
            document.getElementById('loginPassword').value = '';
        }

        async function showDashboard() {
            document.getElementById('viewLogin').classList.add('hidden');
            document.getElementById('viewDashboard').classList.remove('hidden');
            document.getElementById('navUser').classList.remove('hidden');
            document.getElementById('navUserName').innerText = loggedInFasil.nama;
            document.getElementById('dashGreeting').innerText = `Halo, ${loggedInFasil.nama}`;
            
            const snapSekolah = await db.ref('master_guru').once('value');
            allSchools = snapSekolah.val() || {};

            renderDashboard();
        }

        async function renderDashboard() {
            const container = document.getElementById('sekolahContainer');
            container.innerHTML = '<div class="text-center text-slate-500 py-12">Memuat jadwal...</div>';
            
            const snapAssign = await db.ref('fasilitator_sekolah/' + loggedInFasil.id).once('value');
            const mySchools = snapAssign.val() || [];
            
            if(mySchools.length === 0) {
                container.innerHTML = '<div class="text-center p-8 bg-white rounded-2xl border border-slate-100 text-slate-500">Anda belum ditugaskan ke sekolah manapun.</div>';
                return;
            }

            const snapJadwal = await db.ref('jadwal_kunjungan').once('value');
            const allJadwal = snapJadwal.val() || {};

            let html = '';
            mySchools.forEach(npsn => {
                const firstTeacher = allSchools[npsn] ? Object.values(allSchools[npsn])[0] : null;
                const schoolName = (firstTeacher && firstTeacher.asal_sekolah) ? firstTeacher.asal_sekolah : npsn;
                const schoolJadwal = allJadwal[npsn] || {};

                let kunjunganHtml = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">';
                for(let i = 1; i <= 6; i++) {
                    const jData = schoolJadwal[`kunjungan_${i}`] || { tanggal: '-', status: 'Belum Diisi', catatan: '-' };
                    let statusColor = "bg-slate-100 text-slate-600";
                    if(jData.status === 'Selesai') statusColor = "bg-emerald-100 text-emerald-700";
                    if(jData.status === 'Direncanakan') statusColor = "bg-blue-100 text-blue-700";
                    if(jData.status === 'Batal/Ditunda') statusColor = "bg-red-100 text-red-700";

                    kunjunganHtml += `
                        <div class="border border-slate-200 rounded-xl p-4 hover:border-indigo-300 transition-colors cursor-pointer group" onclick="bukaModalKunjungan('${npsn}', '${schoolName.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', ${i})">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-slate-800">Kunjungan ${i}</span>
                                <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${jData.status}</span>
                            </div>
                            <p class="text-sm text-slate-600 mb-1"><span class="font-medium">Tgl:</span> ${jData.tanggal}</p>
                            <p class="text-xs text-slate-500 truncate"><span class="font-medium">Catatan:</span> ${jData.catatan}</p>
                            <div class="mt-3 text-xs font-medium text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity">Klik untuk edit &rarr;</div>
                        </div>
                    `;
                }
                kunjunganHtml += '</div>';

                html += `
                    <div class="glass-card rounded-2xl p-6 md:p-8 shadow-sm">
                        <h2 class="text-xl font-bold text-slate-900 border-b border-slate-100 pb-4 flex items-center gap-3">
                            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1v1H9V7zm5 0h1v1h-1V7zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1zm-5 4h1v1H9v-1zm5 0h1v1h-1v-1z"/></svg>
                            ${schoolName} <span class="text-sm font-normal text-slate-400">(${npsn})</span>
                        </h2>
                        ${kunjunganHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function bukaModalKunjungan(npsn, schoolName, kunjunganId) {
            document.getElementById('inputKunjunganNpsn').value = npsn;
            document.getElementById('inputKunjunganId').value = kunjunganId;
            document.getElementById('modalKunjunganTitle').innerText = `Kunjungan Ke-${kunjunganId}`;
            document.getElementById('modalKunjunganSub').innerText = schoolName;
            
            // Clear or set loading state
            document.getElementById('inputKunjunganTanggal').value = '';
            document.getElementById('inputKunjunganStatus').value = 'Direncanakan';
            document.getElementById('inputKunjunganCatatan').value = 'Memuat...';

            const modal = document.getElementById('modalKunjungan');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            db.ref(`jadwal_kunjungan/${npsn}/kunjungan_${kunjunganId}`).once('value').then(snap => {
                const data = snap.val();
                if(data) {
                    document.getElementById('inputKunjunganTanggal').value = data.tanggal !== '-' ? data.tanggal : '';
                    document.getElementById('inputKunjunganStatus').value = data.status !== 'Belum Diisi' ? data.status : 'Direncanakan';
                    document.getElementById('inputKunjunganCatatan').value = data.catatan !== '-' ? data.catatan : '';
                } else {
                    document.getElementById('inputKunjunganTanggal').value = '';
                    document.getElementById('inputKunjunganStatus').value = 'Direncanakan';
                    document.getElementById('inputKunjunganCatatan').value = '';
                }
            }).catch(e => {
                console.error(e);
                document.getElementById('inputKunjunganCatatan').value = '';
            });
        }

        function closeModalKunjungan() {
            const modal = document.getElementById('modalKunjungan');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function simpanKunjungan() {
            const npsn = document.getElementById('inputKunjunganNpsn').value;
            const kId = document.getElementById('inputKunjunganId').value;
            const tanggal = document.getElementById('inputKunjunganTanggal').value || '-';
            const status = document.getElementById('inputKunjunganStatus').value;
            const catatan = document.getElementById('inputKunjunganCatatan').value || '-';

            await db.ref(`jadwal_kunjungan/${npsn}/kunjungan_${kId}`).set({
                tanggal, status, catatan
            });
            
            closeModalKunjungan();
            renderDashboard();
        }
    </script>
</body>
</html>
