<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Hadir Kunjungan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#4f46e5', secondary: '#0f172a' }
                }
            }
        }
    </script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full">
        <div class="text-center mb-6">
            <a href="index.html" class="block hover:opacity-80 transition-opacity" title="Kembali ke Beranda"><img src="./logo.png" alt="Logo BGTK" class="h-16 sm:h-20 w-auto object-contain mx-auto drop-shadow-sm"></a>
        </div>
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-primary p-6 text-center">
            <h1 class="text-2xl font-bold text-white">Daftar Hadir</h1>
            <p class="text-indigo-100 text-sm mt-2" id="subtitle">Memuat data...</p>
        </div>
        
        <div class="p-6">
            <div id="formSection" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah</label>
                    <input type="text" id="namaSekolah" readonly class="w-full bg-slate-100 border-slate-200 rounded-lg px-4 py-2 border text-slate-600 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap Anda <span class="text-red-500">*</span></label>
                    <input type="text" id="namaPeserta" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary px-4 py-2 border" placeholder="Cth: Budi Santoso, S.Pd" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jabatan <span class="text-red-500">*</span></label>
                    <select id="jabatanPeserta" class="w-full border-slate-300 rounded-lg shadow-sm focus:ring-primary focus:border-primary px-4 py-2 border" required>
                        <option value="">-- Pilih Jabatan --</option>
                        <option value="Pengawas">Pengawas</option>
                        <option value="Kepala Sekolah">Kepala Sekolah</option>
                        <option value="Guru">Guru</option>
                        <option value="Murid">Murid</option>
                        <option value="Orang Tua">Orang Tua</option>
                        <option value="Komite">Komite</option>
                        <option value="Warga Sekolah Lainnya">Warga Sekolah Lainnya</option>
                    </select>
                </div>
                
                <button id="btnSubmit" onclick="submitKehadiran()" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl mt-4 transition-colors">
                    Hadir!
                </button>
            </div>

            <div id="loadingSection" class="text-center py-10">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary mx-auto"></div>
                <p class="text-slate-500 mt-4 text-sm">Menghubungkan...</p>
            </div>

            <div id="errorSection" class="hidden text-center py-10">
                <svg class="mx-auto h-12 w-12 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <p class="text-slate-800 font-bold mt-4">Tautan Tidak Valid</p>
                <p class="text-slate-500 text-sm mt-2" id="errorMsg">Pastikan Anda membuka tautan yang benar dari fasilitator.</p>
            </div>

            <div id="successSection" class="hidden text-center py-10">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                    <svg class="h-8 w-8 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <p class="text-slate-800 font-bold text-xl">Kehadiran Tercatat!</p>
                <p class="text-slate-500 text-sm mt-2">Terima kasih, Anda boleh menutup halaman ini.</p>
            </div>
        </div>
    </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCAMKzhVnGGUxdVKAWeoPXYTAZvPSq6yKY",
            authDomain: "sekolah-model-2026.firebaseapp.com",
            databaseURL: "https://sekolah-model-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sekolah-model-2026",
            storageBucket: "sekolah-model-2026.firebasestorage.app",
            messagingSenderId: "1014570073770",
            appId: "1:1014570073770:web:770e7e6cef2a52a3825ad3"
        };
        firebase.initializeApp(firebaseConfig);
        if (firebase.auth && !firebase.auth().currentUser) {
            firebase.auth().signInAnonymously().catch(err => console.warn("Firebase Auth Error:", err));
        }
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const npsn = urlParams.get('npsn');
        const kId = urlParams.get('kunjungan');
        const sekolah = urlParams.get('sekolah');

        function init() {
            if (!npsn || !kId) {
                showSection('errorSection');
                return;
            }

            document.getElementById('subtitle').innerText = `Kunjungan Ke-${kId}`;
            if (sekolah) {
                document.getElementById('namaSekolah').value = decodeURIComponent(sekolah);
            } else {
                document.getElementById('namaSekolah').value = `NPSN: ${npsn}`;
            }

            showSection('formSection');
        }

        async function submitKehadiran() {
            const nama = document.getElementById('namaPeserta').value.trim();
            const jabatan = document.getElementById('jabatanPeserta').value;

            if (!nama || !jabatan) {
                alert("Harap lengkapi Nama dan Jabatan Anda.");
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            try {
                // Gunakan push untuk membuat ID unik
                await db.ref(`jadwal_kunjungan/${npsn}/kunjungan_${kId}/daftar_hadir`).push({
                    nama: nama,
                    jabatan: jabatan,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                showSection('successSection');
            } catch (e) {
                console.error(e);
                alert("Gagal menyimpan kehadiran. Periksa koneksi internet Anda.");
                btn.disabled = false;
                btn.innerHTML = 'Hadir!';
            }
        }

        function showSection(id) {
            ['formSection', 'loadingSection', 'errorSection', 'successSection'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        // Jalankan
        window.onload = init;
    </script>
    <script src="nav-crumbs.js"></script>
</body>
</html>
